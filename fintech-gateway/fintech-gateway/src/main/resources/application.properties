# ── Application ─────────────────────────────────────────────────────────────
spring.application.name=fintech-gateway
server.port=${SERVER_PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Tomcat limits. Bodies are additionally bounded by gateway.security.max-body-bytes.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=8192
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=2MB

# ── Datasource ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DB:FintechGateway}?useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=${MYSQL_USER:fintech}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=gateway-db
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# ── JPA / Flyway ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ── Redis ───────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# ── Actuator / metrics ──────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.metrics.enabled=true
management.metrics.tags.application=fintech-gateway
management.prometheus.metrics.export.enabled=true

# ── OpenAPI (disabled by default; enabled in the dev profile) ───────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html

# ── Gateway: upstream ───────────────────────────────────────────────────────
gateway.backend.url=${BACKEND_URL:http://localhost:8080}
gateway.backend.connect-timeout=${BACKEND_CONNECT_TIMEOUT:2s}
gateway.backend.read-timeout=${BACKEND_READ_TIMEOUT:10s}
gateway.backend.mtls.enabled=${BACKEND_MTLS_ENABLED:false}
gateway.backend.mtls.bundle=${BACKEND_MTLS_BUNDLE:gateway-backend}
gateway.proxy.max-response-bytes=${MAX_UPSTREAM_RESPONSE_BYTES:10485760}

# ── Gateway: CORS ───────────────────────────────────────────────────────────
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# ── Gateway: risk ───────────────────────────────────────────────────────────
gateway.risk.block-threshold=${RISK_BLOCK_THRESHOLD:71}
gateway.risk.throttle-threshold=${RISK_THROTTLE_THRESHOLD:31}
gateway.risk.zone=${RISK_ZONE:Asia/Kolkata}

# ── Gateway: rate limiting ──────────────────────────────────────────────────
gateway.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
gateway.rate-limit.window=${RATE_LIMIT_WINDOW:1m}
gateway.rate-limit.high-trust-limit=${RATE_HIGH_TRUST:50}
gateway.rate-limit.medium-trust-limit=${RATE_MEDIUM_TRUST:30}
gateway.rate-limit.low-trust-limit=${RATE_LOW_TRUST:10}
gateway.rate-limit.throttle-cost=${RATE_THROTTLE_COST:3}
# gcra (default, O(1) memory) or sorted-set (exact per-event window).
gateway.rate-limit.algorithm=${RATE_LIMIT_ALGORITHM:gcra}
# Coarse per-tenant + per-IP abuse ceiling. Not a quota: raise it in capacity runs.
gateway.rate-limit.abuse-limit-per-ip=${RATE_ABUSE_LIMIT_PER_IP:6000}

# ── Gateway: idempotency ────────────────────────────────────────────────────
gateway.idempotency.ttl=${IDEMPOTENCY_TTL:24h}
gateway.idempotency.required-paths=${IDEMPOTENCY_REQUIRED_PATHS:/api/payments}
gateway.idempotency.max-key-length=${IDEMPOTENCY_MAX_KEY_LENGTH:255}

# ── Gateway: security ───────────────────────────────────────────────────────
gateway.security.trust-proxy=${TRUST_PROXY:false}
gateway.security.max-body-bytes=${MAX_BODY_BYTES:1048576}
gateway.security.ops-api-key=${INTERNAL_OPS_API_KEY:}
gateway.security.ops-max-failed-attempts=${OPS_MAX_FAILED_ATTEMPTS:10}
gateway.security.ops-lockout-window=${OPS_LOCKOUT_WINDOW:15m}
gateway.security.hsts-enabled=${HSTS_ENABLED:true}

# ── Gateway: tenancy ────────────────────────────────────────────────────────
gateway.tenant.header=${TENANT_HEADER:X-Tenant-Id}
gateway.tenant.default-tenant=${DEFAULT_TENANT:default}
gateway.tenant.pattern=${TENANT_PATTERN:^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$}

# ── Gateway: OAuth2 client authentication ───────────────────────────────────
# Fail-closed by default: the gateway refuses to start unless OAUTH2_ISSUER_URI
# or OAUTH2_JWK_SET_URI is configured, and the dev profile must explicitly
# disable authentication for local/demo use.
gateway.auth.enabled=${GATEWAY_AUTH_ENABLED:true}
gateway.auth.issuer-uri=${OAUTH2_ISSUER_URI:}
gateway.auth.jwk-set-uri=${OAUTH2_JWK_SET_URI:}
gateway.auth.audience=${OAUTH2_AUDIENCE:fintech-gateway}
gateway.auth.tenant-claim=${OAUTH2_TENANT_CLAIM:tenant_id}
gateway.auth.client-id-claim=${OAUTH2_CLIENT_ID_CLAIM:client_id}
gateway.auth.scope-claim=${OAUTH2_SCOPE_CLAIM:scope}
gateway.auth.required-scopes=${OAUTH2_REQUIRED_SCOPES:}
gateway.auth.clock-skew=${OAUTH2_CLOCK_SKEW:60s}

# ── Gateway: audit evidence ─────────────────────────────────────────────────
# 1.0 persists every event. Below 1.0, only clean ALLOW rows are sampled;
# security, payment, idempotency and operator events are always persisted.
# The prod profile refuses to start below 0.01.
gateway.audit.sample-rate=${AUDIT_SAMPLE_RATE:1.0}
gateway.audit.never-sample-paths=${AUDIT_NEVER_SAMPLE_PATHS:/api/payments,/api/transfers,/api/transactions,/api/refunds}
gateway.audit.critical-queue-capacity=${AUDIT_CRITICAL_QUEUE_CAPACITY:20000}
gateway.audit.sampled-queue-capacity=${AUDIT_SAMPLED_QUEUE_CAPACITY:10000}
gateway.audit.write-batch-size=${AUDIT_WRITE_BATCH_SIZE:500}
gateway.audit.write-flush-interval=${AUDIT_WRITE_FLUSH_INTERVAL:100ms}

# ── Gateway: compliance evidence ────────────────────────────────────────────
gateway.compliance.default-window=${COMPLIANCE_DEFAULT_WINDOW:24h}
gateway.compliance.max-window=${COMPLIANCE_MAX_WINDOW:90d}
gateway.compliance.default-rows=${COMPLIANCE_DEFAULT_ROWS:1000}
gateway.compliance.max-rows=${COMPLIANCE_MAX_ROWS:10000}

# ── JSON / logging ──────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
logging.level.root=INFO
logging.level.com.fintech=INFO
logging.level.AUDIT=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId:-}] - %msg%n
