# Development profile. Never use these defaults in production.
spring.datasource.password=${MYSQL_PASSWORD:fintech_dev_password}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.jpa.show-sql=false
gateway.security.ops-api-key=${INTERNAL_OPS_API_KEY:dev-ops-key-change-me}
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:5500}
# Local/demo mode: no authorization server is required. This is the only
# profile that disables client authentication by default. Set
# GATEWAY_AUTH_ENABLED=true and configure OAUTH2_ISSUER_URI or
# OAUTH2_JWK_SET_URI to exercise the real auth path locally.
gateway.auth.enabled=${GATEWAY_AUTH_ENABLED:false}
gateway.auth.issuer-uri=${OAUTH2_ISSUER_URI:}
gateway.auth.jwk-set-uri=${OAUTH2_JWK_SET_URI:}
# DEBUG is a developer convenience, not a load-test setting: per-request debug
# lines on three appenders dominate CPU once the gateway is at its vCPU limit.
logging.level.com.fintech=${LOG_LEVEL_GATEWAY:DEBUG}
logging.level.AUDIT=INFO
