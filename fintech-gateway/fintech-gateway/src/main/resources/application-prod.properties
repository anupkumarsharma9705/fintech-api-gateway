# Production profile. Secrets must come from the environment or a secret manager.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
gateway.security.hsts-enabled=true
# Client authentication cannot be disabled in production. The base
# application.properties still requires a token verification source; startup
# fails without OAUTH2_ISSUER_URI or OAUTH2_JWK_SET_URI.
gateway.auth.enabled=true
gateway.auth.required-scopes=${OAUTH2_REQUIRED_SCOPES:gateway.api}
management.endpoint.health.show-details=never
logging.level.com.fintech=INFO
logging.level.AUDIT=INFO
