# Redis Cluster profile.
#
# Activated only where a cluster is actually provisioned, e.g.
#   SPRING_PROFILES_ACTIVE=prod,redis-cluster
#   REDIS_CLUSTER_NODES=redis-0.redis:6379,redis-1.redis:6379,redis-2.redis:6379
#
# The gateway's key layout is cluster-safe: every multi-key Lua script operates
# on one tenant's keys, all of which share the {t:<hash>} hash tag, so they map
# to a single slot. See RedisKeys and RedisKeysTest.
spring.data.redis.cluster.nodes=${REDIS_CLUSTER_NODES}
spring.data.redis.cluster.max-redirects=3
# Lettuce's cluster topology refresh. Without it, a failed-over node leaves the
# client retrying a stale topology until the connection is recreated.
spring.data.redis.lettuce.cluster.refresh.period=30s
spring.data.redis.lettuce.cluster.refresh.adaptive=true
