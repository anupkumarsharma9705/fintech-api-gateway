spring.application.name=fintech-gateway
server.port=8081
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
#springdoc.swagger-ui.path=/swagger-ui.html
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Use 3307 now
spring.datasource.url=jdbc:mysql://localhost:3307/FintechGateway
spring.datasource.username=aaryan
spring.datasource.password=2kilo@Alu
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
spring.web.resources.add-mappings=false
spring.data.redis.timeout=2000
spring.data.redis.connect-timeout=2000

# Limit request size ? prevent large payload attacks
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
spring.profiles.active=${SPRING_PROFILE:dev}
logging.config=classpath:logback-spring.xml
