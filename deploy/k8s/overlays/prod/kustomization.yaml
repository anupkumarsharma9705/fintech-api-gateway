apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay. Supply the Secret first (see base/secret.example.yaml);
# kustomize deliberately does not render it.
resources:
  - ../../base
  - ingress.yaml

images:
  - name: ghcr.io/OWNER/fintech-gateway
    newName: ghcr.io/anupkumarsharma/fintech-gateway
    newTag: 1.0.0

replicas:
  - name: fintech-gateway
    count: 3
