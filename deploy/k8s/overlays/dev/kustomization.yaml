apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Development overlay: one replica, in-cluster MySQL and Redis, auth fixture
# profile. Not for production: the database is ephemeral and the secret is a
# known value.
resources:
  - ../../base
  - data.yaml
  - backend.yaml
  - secret.yaml

replicas:
  - name: fintech-gateway
    count: 1

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: fintech-gateway
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1

  - target:
      kind: NetworkPolicy
      name: fintech-gateway
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: fintech-gateway

  - target:
      kind: ConfigMap
      name: fintech-gateway
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: dev
      - op: replace
        path: /data/MYSQL_HOST
        value: mysql
      - op: replace
        path: /data/MYSQL_SSL
        value: "false"
      - op: replace
        path: /data/REDIS_CLUSTER_NODES
        value: ""
      - op: add
        path: /data/REDIS_HOST
        value: redis
      - op: add
        path: /data/REDIS_PORT
        value: "6379"
      - op: replace
        path: /data/BACKEND_URL
        value: http://backend:8080
