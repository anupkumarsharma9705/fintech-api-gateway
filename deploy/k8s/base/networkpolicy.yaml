# Default-deny for the gateway, then the minimum paths it needs.
#
# Addresses are expressed with namespace labels, not pod IPs, so a managed
# database in another namespace still works. If MySQL/Redis are external to the
# cluster, replace the `to` blocks with ipBlock CIDRs for the provider.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fintech-gateway
  labels:
    app.kubernetes.io/name: fintech-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fintech-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # MySQL and Redis.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 6379
    # Core banking upstream.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 8080
