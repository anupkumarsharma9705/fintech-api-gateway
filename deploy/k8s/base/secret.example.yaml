# TEMPLATE ONLY. Never commit real credentials.
#
# Production options, in order of preference:
#   1. External Secrets Operator / Sealed Secrets / your cloud secret manager.
#   2. `kubectl create secret generic fintech-gateway-secrets --from-env-file=...`
#      executed by your deployment pipeline.
#   3. This file applied by an operator who replaces every value.
#
# The keys are environment variable names so the Deployment can use envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: fintech-gateway-secrets
  labels:
    app.kubernetes.io/name: fintech-gateway
type: Opaque
stringData:
  MYSQL_USER: "REPLACE_ME"
  MYSQL_PASSWORD: "REPLACE_ME"
  REDIS_PASSWORD: "REPLACE_ME"
  INTERNAL_OPS_API_KEY: "REPLACE_WITH_32_BYTES_OF_RANDOM"

  # OAuth2 / JWT validation. The gateway fails closed without these in prod.
  OAUTH2_ISSUER_URI: "https://issuer.example.com/"
  OAUTH2_JWK_SET_URI: "https://issuer.example.com/.well-known/jwks.json"
  OAUTH2_AUDIENCE: "fintech-api"
  OAUTH2_REQUIRED_SCOPES: "gateway.read,gateway.write"
