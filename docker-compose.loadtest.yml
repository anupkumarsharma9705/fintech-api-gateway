# Capacity-test overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d --wait
#
# It adds a zero-cost upstream ("sink") and repoints the gateway at it, so the
# measured latency is the gateway's own cost rather than the backend's.
#
# Rate-limit tiers are overridable here so the same scripts can run in two modes:
#   enforced  -> default production limits; measures contract enforcement
#   saturated -> very high limits; measures the ceiling
#
# This overlay is a measurement fixture. It is never used in a real deployment.

services:

  sink:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./load-tests/capacity/sink/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 5s
    networks:
      - fintech-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  gateway:
    environment:
      BACKEND_URL: http://sink:8080
      RATE_HIGH_TRUST: ${RATE_HIGH_TRUST:-1000000}
      RATE_MEDIUM_TRUST: ${RATE_MEDIUM_TRUST:-1000000}
      RATE_LOW_TRUST: ${RATE_LOW_TRUST:-1000000}
      RATE_ABUSE_LIMIT_PER_IP: ${RATE_ABUSE_LIMIT_PER_IP:-100000000}
      AUDIT_SAMPLE_RATE: ${AUDIT_SAMPLE_RATE:-1.0}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      LOG_LEVEL_GATEWAY: ${LOG_LEVEL_GATEWAY:-INFO}
    depends_on:
      sink:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: ${GATEWAY_CPUS:-2.0}
          memory: ${GATEWAY_MEMORY:-1g}
