# Minimal, deterministic upstream for capacity tests only.
# Not part of the deployable product: the real backend is a Spring Boot service.
# Purpose: remove backend cost from the measurement so gateway cost is visible.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 100000;

    server_tokens off;

    server {
        listen 8080;
        server_name _;

        # One fixed response for every path, so latency variance comes from the
        # gateway only.
        location / {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"OK","sink":true}';
        }
    }
}
