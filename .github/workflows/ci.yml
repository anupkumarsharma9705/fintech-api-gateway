name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B -ntp clean verify

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco'
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Render configuration
        run: |
          cp .env.example .env
          docker compose config -q

  live-stack:
    name: Build and smoke-test the Compose stack
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait

      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8081

          curl -fsS "$base/health"
          curl -fsS "$base/actuator/health/readiness"

          curl -fsS "$base/api/account/balance?accountId=ACC123" | grep -q '"balance":50000'

          # Gateway counters are registered lazily on first recording, so a
          # scrape before any traffic is legitimately empty. Assert a named
          # gateway series after the balance call above.
          curl -fsS "$base/actuator/prometheus" | grep '^gateway_requests_total' > /dev/null

          pay='{"fromAccountId":"ACC123","toAccountId":"ACC456","amount":500,"currency":"INR","idempotencyKey":"ci-payment-1"}'
          curl -fsS -X POST "$base/api/payments/transfer" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-payment-1' \
            -d "$pay" | grep -q '"status":"SUCCESS"'

          curl -fsS -D replay.headers -o replay.json -X POST "$base/api/payments/transfer" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-payment-1' \
            -d "$pay"
          grep -qi '^Idempotency-Replayed: true' replay.headers

          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            "$base/api/account/balance?accountId=ACC123%27%20OR%20%271%27%3D%271")" = 403
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X PROPFIND \
            "$base/api/account/balance?accountId=ACC123")" = 405
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "$base/api/payments/transfer" -H 'Content-Type: application/json' \
            -H 'Content-Encoding: gzip' -d 'not-gzip')" = 415
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            "$base/feedback/summary")" = 401

          curl -fsS "$base/compliance/evidence/summary" \
            -H 'X-Internal-Ops-Key: dev-ops-key-change-me' | grep -q '"attestation"'
          curl -fsS "$base/compliance/evidence/audit.csv?limit=10" \
            -H 'X-Internal-Ops-Key: dev-ops-key-change-me' | grep -q '^id,timestamp,tenant_id'

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
