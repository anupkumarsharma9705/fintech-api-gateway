name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B -ntp clean verify

      # Invoked directly at the reactor root. Binding this goal in a profile
      # also executes it inside every module, which writes module-local BOMs
      # but never the aggregate target/bom.json.
      - name: Generate aggregate CycloneDX SBOM
        run: >
          mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.8.1:makeAggregateBom
          -DoutputFormat=json -DoutputName=bom -DprojectType=application
          -DschemaVersion=1.5 -DincludeTestScope=false

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: target/bom.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco'
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Render configuration
        run: |
          cp .env.example .env
          docker compose config -q

  live-stack:
    name: Build and smoke-test the Compose stack
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait

      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8081

          echo "=== Health checks ==="
          curl -fsS "$base/health"
          echo
          curl -fsS "$base/actuator/health/readiness"
          echo

          echo "=== Balance check ==="
          balance_resp=$(curl -fsS "$base/api/account/balance?accountId=ACC123")
          echo "Response: $balance_resp"
          echo "$balance_resp" | grep -q '"balance":50000'

          echo "=== Prometheus metrics (after traffic) ==="
          curl -fsS "$base/actuator/prometheus" | grep '^gateway_requests_total' > /dev/null
          echo "Metrics OK"

          echo "=== Payment + idempotency ==="
          pay='{"fromAccountId":"ACC123","toAccountId":"ACC456","amount":500,"currency":"INR","idempotencyKey":"ci-payment-1"}'
          pay_resp=$(curl -fsS -X POST "$base/api/payments/transfer" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-payment-1' \
            -d "$pay")
          echo "First payment: $pay_resp"
          echo "$pay_resp" | grep -q '"status":"SUCCESS"'

          curl -fsS -D replay.headers -o replay.json -X POST "$base/api/payments/transfer" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-payment-1' \
            -d "$pay"
          grep -qi '^Idempotency-Replayed: true' replay.headers
          echo "Replay OK"

          echo "=== Security checks ==="
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            "$base/api/account/balance?accountId=ACC123%27%20OR%20%271%27%3D%271")" = 403
          echo "SQLi 403 OK"

          test "$(curl -sS -o /dev/null -w '%{http_code}' -X PROPFIND \
            "$base/api/account/balance?accountId=ACC123")" = 405
          echo "PROPFIND 405 OK"

          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "$base/api/payments/transfer" -H 'Content-Type: application/json' \
            -H 'Content-Encoding: gzip' -d 'not-gzip')" = 415
          echo "Gzip 415 OK"

          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            "$base/feedback/summary")" = 401
          echo "Feedback 401 OK"

          echo "=== Compliance export ==="
          curl -fsS "$base/compliance/evidence/summary" \
            -H 'X-Internal-Ops-Key: dev-ops-key-change-me' | grep -q '"attestation"'
          echo "Summary OK"

          curl -fsS "$base/compliance/evidence/audit.csv?limit=10" \
            -H 'X-Internal-Ops-Key: dev-ops-key-change-me' | grep -q '^id,timestamp,tenant_id'
          echo "CSV OK"

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
