name: Security scan

# Dependency and filesystem scanning. Report-only: findings land in the
# Security tab (SARIF) instead of failing a pull request on an advisory the
# project cannot fix yet. The release workflow is the gate that blocks signing
# on fixable CRITICAL image CVEs.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy filesystem and dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Resolve the dependency tree so the scan sees real versions.
      - name: Build
        run: mvn -B -ntp -DskipTests package

      - name: Scan repository
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          vuln-type: 'os,library'

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
