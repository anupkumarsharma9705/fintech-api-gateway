name: fintech-gateway

# Shared log rotation so a noisy container cannot fill the host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Both Java services run read-only. Tomcat needs a writable temp directory;
# everything else must be explicitly mounted.
x-app-hardening: &app-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-FintechGateway}
      MYSQL_USER: ${MYSQL_USER:-fintech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fintech-network
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      # Optional password. When set, both the server and the healthcheck use it.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PUBLISHED_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\" --no-auth-warning} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fintech-network
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: fintech-backend/fintech-backend/Dockerfile
    image: fintech-backend:local
    restart: unless-stopped
    <<: *app-hardening
    environment:
      SERVER_PORT: 8080
      TZ: UTC
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fintech-network
    logging: *default-logging

  gateway:
    build:
      context: .
      dockerfile: fintech-gateway/fintech-gateway/Dockerfile
    image: fintech-gateway:local
    restart: unless-stopped
    <<: *app-hardening
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-FintechGateway}
      MYSQL_USER: ${MYSQL_USER:-fintech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      BACKEND_URL: http://backend:8080
      INTERNAL_OPS_API_KEY: ${INTERNAL_OPS_API_KEY:?set INTERNAL_OPS_API_KEY in .env}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5500}
      # OAuth2 client authentication. Required in production (prod profile).
      # Configure at least one of OAUTH2_ISSUER_URI or OAUTH2_JWK_SET_URI.
      # GATEWAY_AUTH_ENABLED=true
      # OAUTH2_ISSUER_URI=https://auth.example.com
      # OAUTH2_JWK_SET_URI=https://auth.example.com/.well-known/jwks.json
      # OAUTH2_AUDIENCE=fintech-gateway
      # OAUTH2_REQUIRED_SCOPES=gateway.api
      # OAUTH2_CLOCK_SKEW=60s
      LOG_DIR: /var/log/fintech
      TZ: UTC
    deploy:
      resources:
        limits:
          # Keep the gateway's footprint predictable so the JVM sizes its heap
          # from MaxRAMPercentage rather than the host's total memory.
          cpus: "2"
          memory: 1g
    volumes:
      - gateway_logs:/var/log/fintech
    ports:
      # Loopback by default: put a TLS-terminating proxy in front for anything
      # reachable from outside the host.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # Liveness only. Dependency failures must not trigger container restarts.
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - fintech-network
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  gateway_logs:

networks:
  fintech-network:
    driver: bridge
