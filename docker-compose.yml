version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: Fintech_Gateway_DB
    restart: "no"
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 2kilo@Alulelo
      MYSQL_DATABASE: FintechGateway
      MYSQL_USER: aaryan
      MYSQL_PASSWORD: 2kilo@Alu
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: Fintech_Gateway_redis_cache
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:

networks:
  app-network:
    driver: bridge